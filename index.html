<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Magic - The Masterpiece Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Pacifico', cursive; color: white; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .btn { pointer-events: auto; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.5); color: white; padding: 10px 20px; cursor: pointer; border-radius: 30px; backdrop-filter: blur(5px); transition: 0.3s; font-family: sans-serif; }
        .btn:hover { background: rgba(255, 255, 255, 0.3); }

        #html-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #disney-text { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); font-size: 75px; text-shadow: 0 0 25px #87CEEB; opacity: 0; text-align: center; }
        
        /* Container ảnh rơi (Bo tròn) */
        .falling-photo {
            position: absolute; width: 120px; height: 120px; 
            border-radius: 50%; border: 3px solid #fff; 
            object-fit: cover; box-shadow: 0 0 20px rgba(255,255,255,0.5);
            top: -150px; opacity: 0; z-index: 50;
        }

        #final-paragraph { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; font-family: 'Roboto Mono', monospace; font-size: 19px; text-align: center; color: #fff; opacity: 1; }
        .cursor { display: inline-block; width: 10px; height: 20px; background: #fff; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Bảng chỉnh sửa mở rộng */
        #editor-panel { display: none; position: absolute; top: 70px; left: 20px; background: rgba(0, 0, 0, 0.85); border: 1px solid #555; padding: 20px; border-radius: 15px; font-family: sans-serif; z-index: 200; width: 350px; max-height: 85vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px;}
        .form-group input, .form-group textarea { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; font-size: 13px; }
        #share-link-box { width: 100%; padding: 8px; margin-top: 10px; background: #333; color: #00ff41; border: none; border-radius: 5px; display: none; word-break: break-all; font-size: 11px;}
    </style>
</head>
<body>

<div id="ui-layer">
    <button class="btn" id="music-btn">Phát Nhạc 🎵</button>
</div>

<div id="editor-panel">
    <h3>🛠️ Chỉnh Sửa Quà Tặng</h3>
    <div class="form-group"><label>Link Nhạc (mp3):</label><input type="text" id="ed-musicUrl"></div>
    <div class="form-group"><label>Chữ Disney:</label><input type="text" id="ed-disneyText"></div>
    <div class="form-group"><label>Dòng chữ hạt 1:</label><input type="text" id="ed-starText1"></div>
    <div class="form-group"><label>Dòng chữ hạt 2:</label><input type="text" id="ed-starText2"></div>
    <div class="form-group"><label>Ảnh 1 (Link):</label><input type="text" id="ed-img1"></div>
    <div class="form-group"><label>Ảnh 2 (Link):</label><input type="text" id="ed-img2"></div>
    <div class="form-group"><label>Ảnh 3 (Link):</label><input type="text" id="ed-img3"></div>
    <div class="form-group"><label>Ảnh 4 (Link):</label><input type="text" id="ed-img4"></div>
    <div class="form-group"><label>Đoạn văn cuối:</label><textarea id="ed-finalParagraph" rows="3"></textarea></div>
    <div class="form-group"><label>Màu Trái tim:</label><input type="color" id="ed-heartColor"></div>
    <button class="btn" style="width: 100%; background: #28a745;" onclick="generateLink()">Lưu Thay Đổi</button>
    <textarea id="share-link-box" readonly></textarea>
</div>

<div id="html-layer">
    <div id="disney-text"></div>
    <img class="falling-photo" id="p1">
    <img class="falling-photo" id="p2">
    <img class="falling-photo" id="p3">
    <img class="falling-photo" id="p4">
    <div id="final-paragraph"></div>
</div>

<audio id="bg-music" loop><source src="" type="audio/mpeg"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
/** CẤU HÌNH & EDITOR **/
const DEFAULT_CONFIG = { 
    musicUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
    disneyText: "Walt Disney", starText1: "Magical", starText2: "Moments", 
    img1: "https://picsum.photos/300/300?random=1", img2: "https://picsum.photos/300/300?random=2",
    img3: "https://picsum.photos/300/300?random=3", img4: "https://picsum.photos/300/300?random=4",
    finalParagraph: "Mọi giấc mơ đều có thể thành hiện thực...", heartColor: "#ff3366" 
};
let CONFIG = { ...DEFAULT_CONFIG };
const urlParams = new URLSearchParams(window.location.search);
for (let key in DEFAULT_CONFIG) if (urlParams.has(key)) CONFIG[key] = urlParams.get(key);

if (urlParams.get('edit') === 'true') {
    document.getElementById('editor-panel').style.display = 'block';
    for (let key in DEFAULT_CONFIG) document.getElementById('ed-' + key).value = CONFIG[key];
}

function generateLink() {
    let newParams = new URLSearchParams();
    for (let key in DEFAULT_CONFIG) newParams.set(key, document.getElementById('ed-' + key).value);
    newParams.set('edit', 'true');
    window.location.href = window.location.origin + window.location.pathname + '?' + newParams.toString();
}

// Áp dụng dữ liệu
document.getElementById('bg-music').querySelector('source').src = CONFIG.musicUrl;
document.getElementById('disney-text').innerText = CONFIG.disneyText;
for(let i=1; i<=4; i++) document.getElementById('p'+i).src = CONFIG['img'+i];

/** THREE.JS CORE **/
let scene, camera, renderer, particles, secondaryParticles, geometry;
let state = "IDLE";
let textPoints = [];
const PARTICLE_COUNT = 18000;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2500);
    camera.position.z = 500;
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    createParticles();
    createSecondarySystem(); // Dùng cho vòi nước, sao rơi, pháo hoa
    generateTextCoordinates();
    runTimeline();
    animate();
}

function createParticles() {
    geometry = new THREE.BufferGeometry();
    const pos = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT * 3; i++) pos[i] = (Math.random()-0.5)*2000;
    geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }));
    scene.add(particles);
}

function createSecondarySystem() {
    const secGeo = new THREE.BufferGeometry();
    const secPos = new Float32Array(5000 * 3);
    const secColors = new Float32Array(5000 * 3);
    secGeo.setAttribute('position', new THREE.BufferAttribute(secPos, 3));
    secGeo.setAttribute('color', new THREE.BufferAttribute(secColors, 3));
    secondaryParticles = new THREE.Points(secGeo, new THREE.PointsMaterial({ size: 3, vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
    scene.add(secondaryParticles);
}

function generateTextCoordinates() {
    const canvas = document.createElement('canvas');
    canvas.width = 1000; canvas.height = 400; const ctx = canvas.getContext('2d');
    ctx.font = '75px Pacifico'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(CONFIG.starText1, 500, 160); ctx.fillText(CONFIG.starText2, 500, 290);
    const data = ctx.getImageData(0,0,1000,400).data;
    for(let y=0; y<400; y+=4) { for(let x=0; x<1000; x+=4) { if(data[(y*1000+x)*4] > 150) textPoints.push({x: x - 500, y: -(y - 200), z: (Math.random()-0.5)*15}); } }
}

/** TỌA ĐỘ HÌNH KHỐI **/
function getCastlePoint() {
    let r = Math.random(), x, y, z = (Math.random()-0.5)*50;
    if(r < 0.4) { x = (Math.random()-0.5)*160; y = -100 + Math.random()*120; } 
    else if(r < 0.75) { x = -70 + Math.random()*140; y = 20 + Math.random()*100; } 
    else { x = (Math.random()-0.5)*30; y = 120 + Math.random()*80; } 
    return {x, y, z};
}

function getStarPoint() {
    const angle = Math.random() * Math.PI * 2;
    const r = (Math.random() > 0.5) ? 220 : 100;
    return { x: Math.cos(angle)*r, y: Math.sin(angle)*r, z: (Math.random()-0.5)*30 };
}

function getHeartPoint() {
    let t = Math.random() * Math.PI * 2;
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: x * 12, y: y * 12, z: (Math.random()-0.5)*30 };
}

/** ĐẠO DIỄN KỊCH BẢN **/
function runTimeline() {
    // 1. Hiện Lâu đài
    morphTo("CASTLE", 3.5);
    
    // 2. Vòi phun nước phía sau (Giây 3.5)
    setTimeout(() => { playFountain(); }, 3500);

    // 3. Hiện chữ Disney (Giây 5)
    setTimeout(() => { gsap.to('#disney-text', { opacity: 1, duration: 2 }); }, 5000);

    // 4. Lâu đài bắn lên trời & nổ tung (Giây 10)
    setTimeout(() => {
        gsap.to('#disney-text', { opacity: 0, duration: 1 });
        castleExplosion();
    }, 10000);

    // 5. Tụ thành Ngôi sao (Giây 13.5)
    setTimeout(() => {
        state = "STAR";
        particles.material.color.setHex(0xffdd00);
        morphTo("STAR", 2.5);
    }, 13500);

    // 6. NGÔI SAO BIẾN MẤT -> HIỆN CHỮ + ẢNH RƠI + SAO RƠI + PHÁO HOA (Giây 18)
    setTimeout(() => {
        state = "TEXTS_FALLING";
        particles.material.color.setHex(0xffffff);
        morphTo("TEXTS", 2.5); // Hiện 2 dòng chữ
        launchEverything();    // Chạy đồng loạt các hiệu ứng rơi và pháo hoa
    }, 19000);

    // 7. Kết thúc: Trái tim & Gõ phím (Giây 32)
    setTimeout(() => {
        state = "FINAL";
        gsap.to(secondaryParticles.material, { opacity: 0, duration: 2 });
        typeWriter();
        setTimeout(() => {
            particles.material.color.set(CONFIG.heartColor);
            morphTo("HEART", 3);
        }, 3000);
    }, 33000);
}

function morphTo(shape, duration) {
    const pos = geometry.attributes.position.array;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        let pt;
        if (shape === "CASTLE") pt = getCastlePoint();
        else if (shape === "STAR") pt = getStarPoint();
        else if (shape === "TEXTS") pt = textPoints[i % textPoints.length] || {x:0, y:0, z:0};
        else if (shape === "HEART") pt = getHeartPoint();
        gsap.to(pos, { duration: duration, [i*3]: pt.x, [i*3+1]: pt.y, [i*3+2]: pt.z, ease: "expo.inOut", onUpdate: () => geometry.attributes.position.needsUpdate = true });
    }
}

function castleExplosion() {
    const pos = geometry.attributes.position.array;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        gsap.to(pos, {
            duration: 1.2, [i*3+1]: pos[i*3+1] + 400, ease: "power2.in",
            onComplete: () => {
                gsap.to(pos, { duration: 1.5, [i*3]: (Math.random()-0.5)*2000, [i*3+1]: (Math.random()-0.5)*2000, ease: "expo.out", onUpdate: () => geometry.attributes.position.needsUpdate = true });
            }
        });
    }
}

/** HIỆU ỨNG TỔNG HỢP (PHẦN BẠN YÊU CẦU) **/
function launchEverything() {
    // 1. Ảnh rơi (Bo tròn)
    const photos = document.querySelectorAll('.falling-photo');
    photos.forEach((p, index) => {
        gsap.set(p, { left: (20 + index * 20) + "%", top: -150, opacity: 1, rotation: -20 });
        gsap.to(p, {
            top: window.innerHeight + 150,
            rotation: 20,
            duration: 6 + Math.random() * 4,
            delay: index * 1.5,
            ease: "none",
            repeat: 1
        });
    });

    // 2. Các hạt sao nhỏ rơi xuống (Secondary Particles)
    secondaryParticles.material.opacity = 1;
    const sPos = secondaryParticles.geometry.attributes.position.array;
    const sCol = secondaryParticles.geometry.attributes.color.array;
    for(let i=0; i<3000; i++) {
        sPos[i*3] = (Math.random()-0.5) * window.innerWidth;
        sPos[i*3+1] = window.innerHeight/2 + Math.random()*500;
        sPos[i*3+2] = (Math.random()-0.5) * 200;
        let c = new THREE.Color(0xffffff);
        sCol[i*3] = c.r; sCol[i*3+1] = c.g; sCol[i*3+2] = c.b;

        gsap.to(sPos, {
            [i*3+1]: -800, duration: 5 + Math.random()*5, repeat: -1, ease: "none",
            onUpdate: () => secondaryParticles.geometry.attributes.position.needsUpdate = true
        });
    }

    // 3. Pháo hoa đa sắc màu
    const palette = [0xff0055, 0x00ffcc, 0xffff00, 0xaa00ff, 0x0055ff];
    for(let f=0; f<10; f++) {
        setTimeout(() => {
            const tx = (Math.random()-0.5)*1000;
            const ty = (Math.random()-0.5)*600;
            const color = new THREE.Color(palette[f % palette.length]);
            for(let i=3000; i<5000; i++) {
                let idx = i;
                sPos[idx*3] = tx; sPos[idx*3+1] = ty;
                sCol[idx*3] = color.r; sCol[idx*3+1] = color.g; sCol[idx*3+2] = color.b;
                gsap.fromTo(sPos, {[idx*3]: tx, [idx*3+1]: ty}, {
                    [idx*3]: tx + (Math.random()-0.5)*600, 
                    [idx*3+1]: ty + (Math.random()-0.5)*600,
                    duration: 2, ease: "expo.out"
                });
            }
            secondaryParticles.geometry.attributes.color.needsUpdate = true;
        }, f * 1200);
    }
}

function playFountain() {
    secondaryParticles.material.opacity = 0.8;
    const sPos = secondaryParticles.geometry.attributes.position.array;
    for(let i=0; i<2000; i++) {
        let angle = Math.random()*Math.PI*2; let r = Math.random()*200;
        sPos[i*3] = 0; sPos[i*3+1] = -100; sPos[i*3+2] = -60;
        gsap.to(sPos, { duration: 2.5, [i*3]: Math.cos(angle)*r, [i*3+1]: 200 + Math.random()*100, [i*3+2]: Math.sin(angle)*r - 60, ease: "power2.out", onUpdate: () => secondaryParticles.geometry.attributes.position.needsUpdate = true });
        gsap.to(sPos, { duration: 1.5, delay: 2.5, [i*3+1]: -300, ease: "power2.in" });
    }
    setTimeout(() => gsap.to(secondaryParticles.material, {opacity: 0, duration: 1}), 4000);
}

function typeWriter() {
    const el = document.getElementById('final-paragraph');
    let i = 0;
    function type() {
        if(i < CONFIG.finalParagraph.length) {
            el.innerHTML = CONFIG.finalParagraph.substring(0, i+1) + '<span class="cursor"></span>';
            i++; setTimeout(type, 60);
        }
    }
    type();
}

function animate() {
    requestAnimationFrame(animate);
    if(state === "STAR") particles.rotation.y += 0.005;
    else if(state === "FINAL") particles.rotation.y += 0.015;
    renderer.render(scene, camera);
}

document.getElementById('music-btn').onclick = function() {
    const audio = document.getElementById('bg-music');
    if(audio.paused) { audio.play(); this.innerText = "Tắt Nhạc 🔇"; } 
    else { audio.pause(); this.innerText = "Phát Nhạc 🎵"; }
};

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
